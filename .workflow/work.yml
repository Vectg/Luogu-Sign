version: '1.0'
name: luogu-punch
displayName: 洛谷每日打卡
triggers:
  trigger: auto
  schedule:
    - cron: '0 0 8 * * ? *'
variables:
  global:
    - COOKIE_1
    - COOKIE_2
    - COOKIE_3
    - COOKIE_4
    - COOKIE_5
    - COOKIE_6
    - COOKIE_7
    - COOKIE_8
    - COOKIE_9
    - COOKIE_10
stages:
  - name: build
    displayName: build
    strategy: naturally
    trigger: auto
    executor:
      - public
    steps:
      - step: build@python
        name: punch
        displayName: punch
        pythonVersion: '3.9'
        commands:
          - pip install requests -i https://pypi.tuna.tsinghua.edu.cn/simple
          - python ./luogu-auto-punch.py
        caches: []
        notify: []
        strategy:
          retry: '0'
